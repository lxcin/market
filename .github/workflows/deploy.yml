name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        working-directory: market-server
        run: mvn -B -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: market-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/market-server:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: market-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/market-web:latest

      - name: Build & push Elasticsearch image (IK + pinyin)
        uses: docker/build-push-action@v6
        with:
          context: docker/elasticsearch
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/market-es:8.11.0
